[package]
name = "ace"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Adaptive Compression Engine: lossless, deterministic, schema-free block compression with random access"
readme = "README.md"
keywords = ["compression", "lossless", "timeseries", "random-access", "deterministic"]
categories = ["compression", "algorithms"]

[features]
default = []
# `Engine::explain`: per-block planner report (`BlockReport`).
explain = []
# Hidden module `ace::internal` with the conversions between the facade types and the internal
# crates. It exists only so that the mapping tests can live in `tests/`; it is not part of the
# API, and the dev-dependency below is the only thing that enables it.
internal-testing = []

[dependencies]
ace-core = { path = "../ace-core" }
ace-engine = { path = "../ace-engine" }
ace-dictionary = { path = "../ace-dictionary" }
ace-stream = { path = "../ace-stream" }

[dev-dependencies]
ace = { path = ".", features = ["explain", "internal-testing"] }
ace-corpus = { path = "../ace-corpus" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
