[package]
name = "ace-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ace-core = { path = "../crates/ace-core" }
ace-engine = { path = "../crates/ace-engine" }
ace-format = { path = "../crates/ace-format" }

[[bin]]
name = "container_decode"
path = "fuzz_targets/container_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "index_parse"
path = "fuzz_targets/index_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "trailer_parse"
path = "fuzz_targets/trailer_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "range_open"
path = "fuzz_targets/range_open.rs"
test = false
doc = false
bench = false
