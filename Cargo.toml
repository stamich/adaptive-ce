[workspace]
exclude = ["fuzz"]
members = [
  "crates/ace-core",
  "crates/ace-bitpack",
  "crates/ace-analysis",
  "crates/ace-transforms",
  "crates/ace-codecs",
  "crates/ace-entropy",
  "crates/ace-dictionary",
  "crates/ace-cost",
  "crates/ace-planner",
  "crates/ace-format",
  "crates/ace-index",
  "crates/ace-runtime",
  "crates/ace-simd",
  "crates/ace-stream",
  "crates/ace-engine",
  "crates/ace-cli",
  "crates/ace-corpus",
  "examples/rust-demo",
  "examples/rust-benchmark",
  "examples/random-access-demo",
  "examples/parallel-demo",
]
resolver = "2"

[workspace.package]
version = "0.4.5"
edition = "2021"
license = "Apache-2.0"
repository = "https://example.invalid/ace"

[workspace.dependencies]
thiserror = "2"
crc32c = "0.6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
num_cpus = "1"
proptest = "1"
flate2 = "1"
lz4_flex = "0.11"
zstd = "0.13"
