[workspace]
exclude = ["fuzz"]
members = [
  "crates/ace-core",
  "crates/ace-bitpack",
  "crates/ace-analysis",
  "crates/ace-transforms",
  "crates/ace-codecs",
  "crates/ace-entropy",
  "crates/ace-dictionary",
  "crates/ace-cost",
  "crates/ace-planner",
  "crates/ace-format",
  "crates/ace-index",
  "crates/ace-runtime",
  "crates/ace-simd",
  "crates/ace-stream",
  "crates/ace-engine",
  "crates/ace-cli",
  "crates/ace-corpus",
  "crates/ace-bench",
]
resolver = "2"

[profile.release]
# Recorded explicitly so benchmark results are reproducible (these are Cargo defaults).
opt-level = 3
lto = false
codegen-units = 16
debug = false
panic = "unwind"

[workspace.package]
version = "0.4.6"
edition = "2021"
license = "Apache-2.0"
repository = "https://example.invalid/ace"
rust-version = "1.75"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.dependencies]
thiserror = "2"
crc32c = "0.6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
num_cpus = "1"
proptest = "1"
sha2 = "0.10"
flate2 = "1"
lz4_flex = "0.11"
zstd = "0.13"
