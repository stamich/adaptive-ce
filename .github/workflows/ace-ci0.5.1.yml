# Thin GitHub Actions wrapper around the vendor-neutral ./ace-ci0.5.1.sh.
# The build toolchain (1.98.1 + rustfmt + clippy) comes from rust-toolchain.toml; the msrv job
# installs the MSRV (1.97.0) next to it and selects it explicitly.
name: ace-ci-0.5.1
on: [push, pull_request]
jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustc --version && cargo clippy --version
      - run: ./ace-ci0.5.1.sh pr
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.97.0 --profile minimal && cargo +1.97.0 --version
      - run: ./ace-ci0.5.1.sh msrv
