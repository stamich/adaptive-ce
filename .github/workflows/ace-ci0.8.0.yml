# Thin GitHub Actions wrapper around the vendor-neutral ./ace-ci0.8.0.sh.
# The build toolchain (1.98.1 + rustfmt + clippy) comes from rust-toolchain.toml and is also the
# MSRV (`rust-version`), so one `pr` job covers both.
#
# Every job keeps its full output in ci.log; on failure the compiler errors, clippy lints, test
# failures and panics are re-emitted as `::error::` annotations so they are visible in the
# check-run summary without downloading the log.
name: ace-ci-0.8.0
on: [push, pull_request]
jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustc --version && cargo clippy --version
      - uses: actions/cache@v4
        id: cbindgen
        with:
          path: ~/.cargo/bin/cbindgen
          key: cbindgen-0.29.0
      - if: steps.cbindgen.outputs.cache-hit != 'true'
        run: cargo install cbindgen --locked --version 0.29.0
      - run: set -o pipefail; ./ace-ci0.8.0.sh pr 2>&1 | tee ci.log
      - if: failure()
        run: tools/ace-ci-annotate0.8.0.sh ci.log
  aarch64:
    # Native ARM64 runner: the scalar kernels must write the same bytes as x86_64 (the golden
    # file). The NEON backend arrives in 0.8.0 (task 4); until then this job checks correctness only.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustc --version
      - run: set -o pipefail; ACE_EXPECT_ARCH=aarch64 ./ace-ci0.8.0.sh aarch64 2>&1 | tee ci.log
      - if: failure()
        run: tools/ace-ci-annotate0.8.0.sh ci.log
  jvm:
    # Java and Scala SDKs (jvm/) on the minimum JDK (22, java.lang.foreign final) and on 25 LTS.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [22, 25]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustc --version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.1.0
      - run: set -o pipefail; ./ace-ci0.8.0.sh jvm 2>&1 | tee ci.log
      - if: failure()
        run: tools/ace-ci-annotate0.8.0.sh ci.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports-${{ matrix.java }}
          path: jvm/**/build/reports/tests
          if-no-files-found: ignore
  fuzz-smoke:
    # 20 targets x 25 s on every push / PR. The corpus is kept between runs as a CI cache and
    # published as an artifact; it is never committed (fuzz/README.md, "Corpus policy").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal && cargo install cargo-fuzz --locked
      - uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - run: set -o pipefail; ACE_FUZZ_REQUIRED=1 ./ace-ci0.8.0.sh fuzz-smoke 2>&1 | tee ci.log
      - if: failure()
        run: tools/ace-ci-annotate0.8.0.sh ci.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-and-artifacts
          path: |
            fuzz/corpus
            fuzz/artifacts
          if-no-files-found: ignore
