# SonarQube Cloud analysis. Separate from ace-ci so that a Sonar outage or a missing token can
# never fail the build. Needs the repository secret SONAR_TOKEN; without it (forks, new clones)
# the job is skipped. Configuration: sonar-project.properties.
name: sonarqube-cloud
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonar:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: blame, new-code detection
      - name: Skip when the token is not configured
        id: gate
        run: |
          if [ -z "$SONAR_TOKEN" ]; then echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "::notice::SONAR_TOKEN is not set; skipping SonarQube Cloud analysis"; else echo "enabled=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.enabled == 'true'
        run: rustup show && rustup component add llvm-tools-preview clippy
      - if: steps.gate.outputs.enabled == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage (LCOV)
        if: steps.gate.outputs.enabled == 'true'
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Clippy report (JSON)
        if: steps.gate.outputs.enabled == 'true'
        run: cargo clippy --workspace --all-targets --message-format=json > clippy-report.json
      - name: SonarQube Cloud scan
        if: steps.gate.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v6
