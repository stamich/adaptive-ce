# Thin GitHub Actions wrapper around the vendor-neutral ./ace-ci0.6.1.sh.
# The build toolchain (1.98.1 + rustfmt + clippy) comes from rust-toolchain.toml and is also the
# MSRV (`rust-version`), so one `pr` job covers both.
#
# Every job keeps its full output in ci.log; on failure the compiler errors, clippy lints, test
# failures and panics are re-emitted as `::error::` annotations so they are visible in the
# check-run summary without downloading the log.
name: ace-ci-0.6.1
on: [push, pull_request]
jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustc --version && cargo clippy --version
      - run: set -o pipefail; ./ace-ci0.6.1.sh pr 2>&1 | tee ci.log
      - if: failure()
        run: tools/ace-ci-annotate0.6.1.sh ci.log
  fuzz-smoke:
    # 18 targets x 25 s on every push / PR. The corpus is kept between runs as a CI cache and
    # published as an artifact; it is never committed (fuzz/README.md, "Corpus policy").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal && cargo install cargo-fuzz --locked
      - uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - run: set -o pipefail; ACE_FUZZ_REQUIRED=1 ./ace-ci0.6.1.sh fuzz-smoke 2>&1 | tee ci.log
      - if: failure()
        run: tools/ace-ci-annotate0.6.1.sh ci.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-and-artifacts
          path: |
            fuzz/corpus
            fuzz/artifacts
          if-no-files-found: ignore
