# SonarQube Cloud (https://sonarcloud.io) project configuration.
# CI-based analysis: .github/workflows/ace-sonarcloud0.6.1.yml produces the coverage and clippy
# reports and runs the scanner. Automatic Analysis must be switched OFF for this project in
# SonarQube Cloud (Administration > Analysis Method), otherwise the two analyses conflict.
sonar.organization=stamich
sonar.projectKey=stamich_adaptive-ce
sonar.projectName=adaptive-ce
sonar.projectVersion=0.6.1

# Production code is crates/*/src; integration tests live in crates/*/tests.
sonar.sources=crates
sonar.inclusions=**/src/**/*.rs
sonar.tests=crates
sonar.test.inclusions=**/tests/**/*.rs
sonar.exclusions=**/target/**,**/tests/**,**/benches/**
sonar.sourceEncoding=UTF-8

# Reports are produced by the workflow (cargo llvm-cov / cargo clippy); both are optional.
sonar.rust.lcov.reportPaths=lcov.info
sonar.rust.clippyReport.reportPaths=clippy-report.json

# Benchmark harness, fuzz targets and generated tooling are not part of the shipped library.
sonar.coverage.exclusions=crates/ace-bench/**,crates/ace-cli/src/main.rs
sonar.cpd.exclusions=crates/ace-bench/**
