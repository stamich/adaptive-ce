# Generates include/ace.h from crates/ace-ffi (docs/FFI.md).
#   cbindgen --config cbindgen.toml --crate ace-ffi --output include/ace.h
# CI regenerates the header and fails when the committed file differs (tools/ace-check_header0.7.0.sh).
language = "C"
header = """
/*
 * ACE C ABI, version 1. Generated by cbindgen from crates/ace-ffi; do not edit.
 * Conventions: docs/NATIVE-INTEROP.md. Function reference: docs/FFI.md.
 * Licensed under the Apache License, Version 2.0.
 */"""
include_guard = "ACE_H"
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
cpp_compat = true
documentation = true
documentation_style = "c99"
usize_is_size_t = true
style = "both"
sort_by = "None"

[parse]
parse_deps = false

[export]
include = ["AceStatus"]

[fn]
args = "auto"

[const]
allow_static_const = false

[enum]
prefix_with_name = false
